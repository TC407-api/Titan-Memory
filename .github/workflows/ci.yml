name: CI
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips the better-sqlite3 native build; the sqlite tests need it.
      - name: Build better-sqlite3 binding
        run: npm rebuild better-sqlite3

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      # Some suites leave handles open, so Jest would not exit on its own.
      - name: Tests
        run: npm test -- --forceExit
