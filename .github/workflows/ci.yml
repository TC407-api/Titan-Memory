name: CI
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The first entry is the exact minimum from "engines" in package.json.
        # The better-sqlite3 binding crashes the process on an older Node, so
        # the suite has to run there as well as on the current 22 release.
        node-version: ['22.14.0', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # better-sqlite3 13 ships its prebuilt bindings inside the package and has
      # no install script, so the sqlite tests need no separate build step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      # Some suites leave handles open, so Jest would not exit on its own.
      - name: Tests
        run: npm test -- --forceExit
